name: Browser verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      companion_ref:
        description: Branch or commit of the companion repository
        default: main
        required: false

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [vanilla, nextjs, astro, sveltekit, nuxt, react-router, tanstack, motion]
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: animaxxing-skills

      - name: Check out the companion repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: johnpolacek/animaxxing-skills-test
          ref: ${{ inputs.companion_ref || 'main' }}
          path: animaxxing-skills-test

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install the test workspace
        working-directory: animaxxing-skills-test
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: animaxxing-skills-test
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser checks
        working-directory: animaxxing-skills-test
        run: pnpm exec playwright test -c ${{ matrix.suite }}/playwright.config.ts

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.suite }}-test-results
          path: animaxxing-skills-test/${{ matrix.suite }}/test-results
          retention-days: 7

