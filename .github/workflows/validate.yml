name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate Agent Skills specification
        run: |
          for skill in skills/*/; do
            uvx --from skills-ref==0.1.1 agentskills validate "$skill"
          done

      - name: Verify skills CLI discovery
        run: |
          npx --yes skills@1.5.23 add . --list | tee /tmp/animaxxing-skills-list.txt
          for skill in skills/*/; do
            name="${skill%/}"
            name="${name##*/}"
            grep -q "$name" /tmp/animaxxing-skills-list.txt
          done

      - name: Validate manifests, versions, and relative links
        run: python scripts/validate_repository.py
