name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate Agent Skills specification
        run: |
          for skill in skills/*/; do
            uvx --from skills-ref==0.1.1 agentskills validate "$skill"
          done

      - name: Verify skills CLI discovery
        run: |
          npx --yes skills@1.5.23 add . --list | tee /tmp/animaxxing-skills-list.txt
          for skill in skills/*/; do
            name="${skill%/}"
            name="${name##*/}"
            grep -q "$name" /tmp/animaxxing-skills-list.txt
          done

      - name: Validate manifests, versions, and relative links
        run: python scripts/validate_repository.py
